jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3309/hanbit_erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
# 실제 계정 정보는 하드코딩하지 않고 환경변수(JDBC_USERNAME/JDBC_PASSWORD)에서 읽는다.
# context-common.xml의 <context:property-placeholder>가 시스템 환경변수를 이 파일보다
# 우선 적용하도록 설정돼 있다 — 로컬에서는 .env.example을 참고해 값을 export한 뒤 실행한다.
# 값이 없으면 jdbc.password는 빈 문자열로 남아 DB 연결이 실패한다(하드코딩된 기본 비밀번호를
# 두지 않기 위한 의도적인 동작).
jdbc.username=${JDBC_USERNAME:erp}
jdbc.password=${JDBC_PASSWORD:}
